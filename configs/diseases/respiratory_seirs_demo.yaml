schema_version: "1.1"
parameter_set_id: respiratory-demo-v1.1
module: generic_respiratory_seirs
durations:
  latent:
    schema_version: "1.1"
    family: constant
    mean_days: 2.0
    cv: null
    units: days
    status: scenario_assumption
    source_ids: []
    notes: Pathogen-neutral constant-duration demonstration; no non-zero CV is claimed.
  infectious:
    schema_version: "1.1"
    family: constant
    mean_days: 5.0
    cv: null
    units: days
    status: scenario_assumption
    source_ids: []
    notes: Pathogen-neutral constant-duration demonstration; no non-zero CV is claimed.
  immunity:
    schema_version: "1.1"
    family: constant
    mean_days: 30.0
    cv: null
    units: days
    status: scenario_assumption
    source_ids: []
    notes: Inactive while generic complete waning is disabled; retained for the V1 comparator.
parameters:
  transmission_beta:
    value: 0.08
    distribution: fixed daily per-edge probability before route weight
    units: probability per active daily edge
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 1.0]
    notes: Demonstration value only; it is not a named-pathogen estimate.
  initial_seed_count:
    value: 10.0
    distribution: fixed count
    units: synthetic agents
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 104540.0]
    notes: Deterministically selected from the existing synthetic population.
  initial_prevalence:
    value: null
    distribution: not used in the default run
    units: proportion
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 1.0]
    notes: An alternative deterministic initializer; the default uses an explicit seed count.
  import_rate_per_day:
    value: 0.0
    distribution: Poisson rate
    units: synthetic imports per day
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 1000.0]
    notes: Disabled in the default run; no visitor or port process is represented.
  import_schedule:
    value: null
    distribution: optional date-to-count schedule
    units: synthetic imports by date
    status: scenario_assumption
    source_ids: []
    notes: Empty in the default run; this is not an arrivals or origin-prevalence model.
  infectiousness_profile:
    value: 1.0
    distribution: constant while infected
    units: relative infectiousness
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 1.0]
    notes: No presymptomatic, symptomatic or asymptomatic profile is enabled in M5.
  immunity_waning_enabled:
    value: 0.0
    distribution: fixed switch
    units: boolean encoded as 0 or 1
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 1.0]
    notes: Complete waning is disabled in the V1.1 pathogen-neutral demonstration.
  immunity_acquisition:
    value: 1.0
    distribution: fixed post-recovery protection
    units: relative protection
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 1.0]
    notes: Recovery moves agents to the recovered state until configured waning.
  symptom_probability:
    value: 0.6
    distribution: fixed Bernoulli prognosis
    units: probability per infection episode
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 1.0]
    notes: Transferred unchanged from the V1 synthetic observation assumption; not pathogen evidence.
  asymptomatic_relative_infectiousness:
    value: null
    distribution: not implemented
    units: relative infectiousness
    status: scenario_assumption
    source_ids: []
    notes: Deferred with the asymptomatic substate.
  age_susceptibility:
    value: null
    distribution: not implemented
    units: relative susceptibility
    status: scenario_assumption
    source_ids: []
    notes: The core demonstration uses equal susceptibility across synthetic ages.
  severe_progression:
    value: null
    distribution: not implemented
    units: probability
    status: scenario_assumption
    source_ids: []
    notes: Severity and disease deaths are explicitly deferred from the core M5 module.
  disease_death_probability:
    value: null
    distribution: not implemented
    units: probability
    status: scenario_assumption
    source_ids: []
    notes: Disease deaths are not enabled; Starsim demographic deaths are not used by M5.
  seasonal_amplitude:
    value: 0.0
    distribution: fixed amplitude
    units: relative multiplier
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 1.0]
    notes: Seasonality is disabled pending evidence and a separate controlled feature.
  route_multiplier_household:
    value: 1.0
    distribution: fixed route multiplier
    units: relative multiplier
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 10.0]
    notes: Applied to the M4 household edge opportunity weight.
  route_multiplier_school_class:
    value: 1.0
    distribution: fixed route multiplier
    units: relative multiplier
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 10.0]
    notes: Applied to the M4 school_class edge opportunity weight.
  route_multiplier_school_cross_class:
    value: 1.0
    distribution: fixed route multiplier
    units: relative multiplier
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 10.0]
    notes: Applied to the M4 school_cross_class edge opportunity weight.
  route_multiplier_workplace_team:
    value: 1.0
    distribution: fixed route multiplier
    units: relative multiplier
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 10.0]
    notes: Applied to the M4 workplace_team edge opportunity weight.
  route_multiplier_workplace_transient:
