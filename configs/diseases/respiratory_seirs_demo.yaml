  route_multiplier_community_outdoor:
    value: 1.0
    distribution: fixed route multiplier
    units: relative multiplier
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 10.0]
    notes: Applied to the M4 community_outdoor edge opportunity weight.
route_multipliers:
  household: 1.0
  school_class: 1.0
