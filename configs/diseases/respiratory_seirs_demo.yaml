    units: relative multiplier
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 10.0]
    notes: Applied to the M4 care_resident edge opportunity weight.
  route_multiplier_care_staff:
    value: 1.0
    distribution: fixed route multiplier
    units: relative multiplier
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 10.0]
    notes: Applied to the M4 care_staff edge opportunity weight.
  route_multiplier_shared_vehicle:
    value: 1.0
    distribution: fixed route multiplier
    units: relative multiplier
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 10.0]
    notes: Applied to the M4 shared_vehicle edge opportunity weight.
  route_multiplier_bus:
    value: 1.0
    distribution: fixed route multiplier
    units: relative multiplier
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 10.0]
    notes: Applied to the M4 bus edge opportunity weight.
  route_multiplier_community_indoor:
    value: 1.0
    distribution: fixed route multiplier
    units: relative multiplier
    status: scenario_assumption
    source_ids: []
    valid_range: [0.0, 10.0]
