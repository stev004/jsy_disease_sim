[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jersey-outbreak-simulator"
version = "0.1.0"
description = "A local-first, scientifically bounded Jersey outbreak simulation prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Jersey Outbreak Simulator contributors" }]
dependencies = [
    "pydantic>=2.11,<3",
    "numpy>=2,<3",
    "pyarrow>=18,<23",
    "pyyaml>=6,<7",
    "starsim==3.5.2",
    "typer>=0.16,<1",
]

[project.scripts]
jos = "jersey_outbreak.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jersey_outbreak"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
